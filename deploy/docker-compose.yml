# Local development stack:  docker compose -f deploy/docker-compose.yml --env-file .env up --build
name: fin-app
x-python: &python
  build: { context: .., dockerfile: deploy/python.Dockerfile }
  env_file: [{ path: ../.env, required: false }]
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin}
      POSTGRES_DB: ${POSTGRES_DB:-fin}
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fin}"]
      interval: 5s
      retries: 10

  prefect:
    image: prefecthq/prefect:3.7.7-python3.12
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]
    volumes: [prefectdata:/root/.prefect]

  api:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/python.Dockerfile
      args: { PACKAGE: fin-api }
    command: uvicorn fin_api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  worker:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/python.Dockerfile
      args: { PACKAGE: fin-api }
    command: python -m fin_api.worker
    stop_grace_period: 20s

  flows:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/python.Dockerfile
      args: { PACKAGE: fin-flows }
    command: python -m fin_flows.scoring
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    depends_on: [prefect]

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  dbdata:
  prefectdata:
