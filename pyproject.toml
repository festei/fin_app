[project]
name = "fin-app-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "apps/api", "flows"]

[tool.uv.sources]
fin-core = { workspace = true }
fin-api = { workspace = true }
fin-flows = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fin_core", "fin_api", "fin_flows"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests", "flows/tests"]
asyncio_mode = "auto"
