[project]
name = "fin-flows"
version = "0.1.0"
description = "Prefect flows for slow batch work (ingestion, scoring, nightly sandbox valuation)"
requires-python = ">=3.12"
dependencies = [
    "fin-core",
    "prefect>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fin_flows"]
