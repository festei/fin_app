[project]
name = "fin-providers"
version = "0.1.0"
description = "Driven adapter: market-data providers (EDGAR, FRED, Yahoo Finance, Alpha Vantage)."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
    "fin-domain",
    "httpx>=0.27",
    "pandas>=2.2",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_providers"]
