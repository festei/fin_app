[project]
name = "fin-core"
version = "0.1.0"
description = "Shared domain logic: providers, metrics, philosophy graph, signals"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "langgraph>=0.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_core"]
