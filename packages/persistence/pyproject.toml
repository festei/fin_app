[project]
name = "fin-persistence"
version = "0.1.0"
description = "Driven adapter: SQLAlchemy tables, mappers, repositories, unit of work, migrations."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
    "fin-domain",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_persistence"]
