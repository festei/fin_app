[project]
name = "fin-langgraph"
version = "0.1.0"
description = "Driven adapter: runs the domain scorers as a LangGraph graph."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
    "fin-domain",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_langgraph"]
