[project]
name = "fin-testkit"
version = "0.1.0"
description = "In-memory fakes of the application ports, for tests. Never a production dependency."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_testkit"]
