[project]
name = "fin-bootstrap"
version = "0.1.0"
description = "Composition root: reads settings and wires adapters into the use cases."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
    "fin-persistence",
    "fin-providers",
    "fin-telegram",
    "fin-langgraph",
    "fin-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_bootstrap"]
