[project]
name = "fin-application"
version = "0.1.0"
description = "Application layer: use cases, query DTOs and the ports adapters implement."
requires-python = ">=3.12"
dependencies = [
    "fin-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_application"]
