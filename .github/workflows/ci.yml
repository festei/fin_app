# DISABLED for now: CI/CD is deferred to a later stage (everything is tested locally first).
# Only manual runs (workflow_dispatch) are possible. Local equivalents:
#   uv run ruff check . && uv run ruff format --check . && uv run pytest
#   (cd apps/web && pnpm typecheck && pnpm test && pnpm build)
#   scripts/smoke-images.sh
#
# Before re-enabling, restore the triggers and fix:
#   - aquasecurity/trivy-action@0.28.0 does not resolve: pin a tag/SHA that exists
#   - trigger on `pull_request` plus `push` to main only (the current pair ran twice per push),
#     or key the concurrency group on the branch name
#   - add `.github/workflows/**`, `.dockerignore` and `.env.example` to the path filters
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.f.outputs.python }}
      web: ${{ steps.f.outputs.web }}
      docker: ${{ steps.f.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            python:
              - 'packages/**'
              - 'apps/api/**'
              - 'flows/**'
              - 'config/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
            docker:
              - 'deploy/**'
              - 'packages/**'
              - 'apps/**'
              - 'flows/**'
              - 'config/**'
              - 'pyproject.toml'
              - 'uv.lock'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fin-api, file: deploy/python.Dockerfile, args: "PACKAGE=fin-api" }
          - { name: fin-flows, file: deploy/python.Dockerfile, args: "PACKAGE=fin-flows" }
          - { name: fin-web, file: deploy/web.Dockerfile, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          tags: ${{ matrix.name }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Image runs as non-root
        run: |
          user=$(docker image inspect ${{ matrix.name }}:ci --format '{{.Config.User}}')
          echo "image user: '$user'"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
      - name: Smoke test (python images import and find config/)
        if: startsWith(matrix.file, 'deploy/python')
        run: |
          if [ "${{ matrix.name }}" = "fin-api" ]; then
            docker run --rm ${{ matrix.name }}:ci python -c \
              "import fin_api.main, fin_core.graph as g; g.build_graph(); g.load_config()"
          else
            docker run --rm ${{ matrix.name }}:ci python -c "import fin_flows.scoring"
          fi
      - name: Smoke test (web image contains the build)
        if: matrix.name == 'fin-web'
        run: docker run --rm --entrypoint test ${{ matrix.name }}:ci -f /usr/share/nginx/html/index.html
      - name: Trivy scan (HIGH/CRITICAL, fixable only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: TAG=ci POSTGRES_PASSWORD=ci docker compose -f deploy/docker-compose.prod.yml config -q
