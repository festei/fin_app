[project]
name = "fin-api"
version = "0.1.0"
description = "FastAPI service: REST + WebSocket for the trading UI"
requires-python = ">=3.12"
dependencies = [
    "fin-core",
    # Capped: Prefect 3.8's server code (shared workspace env) breaks on newer FastAPI
    # (Body(min_items=...) was removed). Verified working up to 0.136.1; revisit on Prefect upgrade.
    "fastapi>=0.111,<0.137",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_api"]
