[project]
name = "fin-worker"
version = "0.1.0"
description = "Always-on worker: delivery retries, Telegram bot, single-instance lock."
requires-python = ">=3.12"
dependencies = [
    "fin-application",
    "fin-bootstrap",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_worker"]
